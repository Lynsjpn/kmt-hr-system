<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMT 人事管理システム（クラウド版）</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  /* ピンク基調（薄ピンク×淡ピンク） */
  --bg:#fdf7f4; --panel:#ffffff; --border:#f0dcd3; --text:#3a2c26; --sub:#82675c;
  --accent:#b8492e; --accent-soft:#fdeee9; --danger:#c0392b; --danger-soft:#fdecea;
  --warn:#b7791f; --warn-soft:#fdf3e3; --ok:#1e7e4e; --ok-soft:#e6f4ec;
  --radius:10px;
  --sb-w:250px;            /* サイドバー幅 */
  --sb-bg:#fbe5dc;         /* サイドバー背景（ピンク薄） */
  --sb-deep:#f9d0b8;       /* セクション見出し（ピーチ） */
  --sb-deep2:#f5c0a2;      /* セクション見出しホバー（少し濃いピーチ） */
  --sb-head:#fbd9c4;       /* ブランドカード（ピーチ） */
  --sb-on-deep:#7a3520;    /* ピーチ地の上の文字色。白だと読めないため濃い茶にする */
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
/* ===== 左サイドバー・レイアウト ===== */
.app{display:flex;min-height:100vh}
aside#sidebar{width:var(--sb-w);flex-shrink:0;background:var(--sb-bg);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:12px 10px 20px;scrollbar-width:thin}
.app.nologin aside#sidebar,.app.nologin #sbToggle{display:none}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
main{width:100%;max-width:1280px;margin:0 auto;padding:20px;flex:1}
/* ブランドカード */
.sb-brand{background:linear-gradient(160deg,var(--sb-head),#f5c0a2);border-radius:14px;padding:14px 12px;text-align:center;color:var(--sb-on-deep);margin-bottom:10px}
.sb-brand .logo{background:#fff;border-radius:10px;width:64px;height:64px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;
  color:var(--accent);font-weight:900;font-size:20px;letter-spacing:1px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.sb-brand h1{font-size:15px;font-weight:800;line-height:1.4}
.sb-brand .ver{font-size:10px;opacity:.85;text-decoration:underline;margin-top:2px;display:inline-block;color:var(--sb-on-deep)}
/* ユーザー行 */
.sb-user{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 6px;margin-bottom:8px}
.sb-user .dot{width:8px;height:8px;border-radius:50%;background:#2ecc71;flex-shrink:0}
.sb-user b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user .st{color:var(--sub);font-size:11px}
/* マイページボタン */
.sb-mypage{display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;border:1px solid var(--border);
  border-radius:999px;padding:8px;font-size:13px;font-weight:800;color:var(--accent);cursor:pointer;width:100%;margin-bottom:10px;
  box-shadow:0 1px 4px rgba(207,89,64,.12)}
.sb-mypage:hover{background:var(--accent-soft)}
/* アラートカード */
.sb-alert{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:pointer;font-size:12px}
.sb-alert:hover{background:var(--accent-soft)}
.sb-alert .row{display:flex;align-items:center;gap:6px;padding:2px 0}
.sb-alert .row b{flex:1;font-size:12px}
.sb-alert .cnt{background:var(--danger);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:1px 8px}
.sb-alert .cnt.y{background:var(--warn)}
.sb-alert .cnt.z{background:#ccc3bf}
.sb-alert .sub-row{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);padding:1px 0 1px 14px}
/* 更新通知バナー */
.sb-update{background:var(--ok-soft);border:1px solid #b6dfc7;color:var(--ok);border-radius:10px;
  padding:8px 10px;margin-bottom:8px;cursor:pointer;font-size:12px;line-height:1.5}
.sb-update:hover{filter:brightness(.97)}
.sb-update b{display:block;font-size:12px}
/* アナウンス確認カード */
.sb-ann{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:12px}
.sb-ann-head{display:flex;align-items:center;gap:6px;font-weight:800;margin-bottom:4px}
.sb-ann-head .cnt{background:var(--danger);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px}
.sb-ann-head .cnt.z{background:#ccc3bf}
.sb-ann-head a{margin-left:auto;color:var(--accent);text-decoration:none;font-size:15px;line-height:1}
.ann-item{display:flex;align-items:center;gap:6px;padding:4px 2px;cursor:pointer;border-radius:6px}
.ann-item:hover{background:var(--accent-soft)}
.ann-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
.ann-item.unread .t{color:var(--text);font-weight:700}
/* メニューグループ */
.sb-group{margin-bottom:6px}
.sb-group>button{width:100%;display:flex;align-items:center;gap:8px;background:var(--sb-deep);border:none;color:var(--sb-on-deep);
  padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:800}
.sb-group>button:hover{background:var(--sb-deep2)}
.sb-group>button .arrow{font-size:10px;width:12px}
.sb-group>button .gcnt{margin-left:auto;background:rgba(122,53,32,.14);border-radius:999px;padding:1px 8px;font-size:11px}
.sb-items{padding:4px 0 2px}
.sb-item{width:100%;display:flex;align-items:center;gap:8px;background:transparent;border:none;text-align:left;
  padding:8px 10px 8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text)}
.sb-item:hover{background:#fff}
.sb-item.active{background:#fff;color:var(--accent);font-weight:800;box-shadow:0 1px 4px rgba(207,89,64,.15)}
.sb-item .ic{width:18px;text-align:center}
.sb-single{margin-bottom:6px}
.sb-foot{margin-top:10px;text-align:center}
.sb-foot a{color:var(--accent);font-size:12px}
/* モバイル：ハンバーガーで開閉 */
#sbToggle{display:none;position:fixed;top:10px;left:10px;z-index:60;background:var(--accent);color:#fff;border:none;
  border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
@media(max-width:860px){
  #sbToggle{display:block}
  aside#sidebar{position:fixed;left:0;top:0;z-index:55;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  aside#sidebar.open{transform:translateX(0)}
  main{padding:56px 12px 20px}
}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.panel h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h2 .en{font-size:11px;color:var(--sub);font-weight:400}
.grid{display:grid;gap:12px}
.grid.cols4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid.cols3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.stat{background:var(--accent-soft);border-radius:var(--radius);padding:14px;text-align:center}
.stat .num{font-size:26px;font-weight:800;color:var(--accent)}
.stat .lbl{font-size:12px;color:var(--sub);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8efeb;text-align:left;padding:8px;border-bottom:2px solid var(--border);white-space:nowrap;font-size:12px}
td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:#fdf3ef}
.tablewrap{overflow-x:auto}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.b-blue{background:var(--accent-soft);color:var(--accent)}
.b-green{background:var(--ok-soft);color:var(--ok)}
.b-red{background:var(--danger-soft);color:var(--danger)}
.b-yellow{background:var(--warn-soft);color:var(--warn)}
.b-gray{background:#f1eae7;color:var(--sub)}
button.btn{background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
button.btn:hover{filter:brightness(1.1)}
button.btn.secondary{background:#fff;color:var(--accent);border:1px solid var(--accent)}
button.btn.danger{background:var(--danger)}
button.btn.small{padding:4px 10px;font-size:12px}
button.btn.ghost{background:#fff;color:var(--sub);border:1px solid var(--border)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff}
.toolbar .spacer{flex:1}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;max-width:1000px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.center{text-align:center}
.modal h3{font-size:16px;margin-bottom:14px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 14px}
.formgrid label,.field label{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:3px}
.formgrid input,.formgrid select,.formgrid textarea,.field input,.field select,.field textarea{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit}
.formgrid textarea{resize:vertical}
.fieldset{border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:14px}
.fieldset legend{font-size:12px;font-weight:700;color:var(--accent);padding:0 6px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.alert-item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:13px}
.alert-item.red{background:var(--danger-soft)}
.alert-item.yellow{background:var(--warn-soft)}
.alert-item.blue{background:var(--accent-soft)}
.alert-item b{white-space:nowrap}
.muted{color:var(--sub);font-size:12px}
.section-title{font-size:13px;font-weight:800;color:var(--accent);margin:16px 0 8px;border-left:4px solid var(--accent);padding-left:8px}
.doc-status{border:1px solid var(--border);border-radius:6px;padding:3px 6px;font-size:12px;background:#fff}
.st-未依頼{color:var(--sub)} .st-依頼中{color:var(--warn)} .st-受領{color:var(--accent)} .st-確認済{color:var(--ok)} .st-対象外{color:#aaa}
.tag-row{display:flex;gap:6px;flex-wrap:wrap}
.progress{height:8px;background:#f1e5e0;border-radius:6px;overflow:hidden;min-width:80px}
.progress>div{height:100%;background:var(--ok)}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--sub);white-space:nowrap}
.kv dd{font-weight:600}
/* ===== タレント（カオナビ型 顔写真一覧）===== */
.talent-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(var(--card-w,150px),1fr))}
.tcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;transition:box-shadow .15s, transform .15s}
.tcard:hover{box-shadow:0 6px 20px rgba(74,53,45,.15);transform:translateY(-2px)}
.avatar{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;color:#fff;font-weight:800;font-size:22px;letter-spacing:.5px}
.avatar.sm{width:34px;height:34px;font-size:13px;margin:0}
.avatar.lg{width:80px;height:80px;font-size:28px}
.tcard .tname{font-weight:700;font-size:13px;line-height:1.3;word-break:break-word}
.tcard .troma{font-size:10px;color:var(--sub);word-break:break-word}
.tcard .tmeta{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.5}
.tcard .tag-row{justify-content:center;margin-top:6px}
.viewseg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.viewseg button{background:#fff;border:none;padding:7px 12px;font-size:12px;cursor:pointer;color:var(--sub)}
.viewseg button.active{background:var(--accent);color:#fff;font-weight:700}
/* ===== スキル管理 ===== */
.skmap td{text-align:center;padding:4px 6px;min-width:44px}
.skmap td.namecell{text-align:left;white-space:nowrap;position:sticky;left:0;background:#fff;z-index:1}
.skmap th.cat{background:var(--accent-soft);color:var(--accent);font-size:11px}
.sklv{display:inline-block;width:30px;height:24px;line-height:24px;border-radius:6px;font-size:12px;font-weight:700;text-align:center}
.lv0{background:#f4eeeb;color:#c0b3ad}
.lv1{background:#fdeee9;color:#9e4b30}
.lv2{background:#fad6c9;color:#8f4029}
.lv3{background:#f2ac93;color:#6b2d16}
.lv4{background:#c25036;color:#fff}
.lv5{background:#a63c22;color:#fff}
.sk-input-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.sk-input-row .skname{flex:1}
.lvseg{display:inline-flex;gap:3px}
.lvseg button{width:30px;height:26px;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;color:var(--sub)}
.lvseg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.radar-wrap{display:flex;justify-content:center}
/* 英語併記（日本語の横に淡色の英語） */
.en{font-size:11px;color:var(--sub);font-weight:400}
th .en{display:block;font-weight:400}
/* スキル名の列だけ縦書き。カテゴリ見出し（th.cat）は日本語と同じく横書きにする */
.skmap th:not(.cat) .en{writing-mode:vertical-rl;font-size:10px}
.skmap th.cat{white-space:normal;line-height:1.4;padding:6px 8px;vertical-align:middle}
.skmap th.cat .en{writing-mode:horizontal-tb;text-orientation:mixed;font-size:10px;margin-top:2px}
.section-title .en{font-size:11px;margin-left:6px}
.langtoggle{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);
  background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;user-select:none}
.langtoggle input{cursor:pointer}
.sk-input-row .skname .en{margin-left:6px}
/* スキル配下のタスクリスト */
.task-toggle{font-size:11px;color:var(--accent);text-decoration:none;margin-left:8px;white-space:nowrap;font-weight:700}
.task-toggle:hover{text-decoration:underline}
.task-block{background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:2px 0 8px;font-size:12px}
.task-line{padding:3px 0;line-height:1.5}
.task-line.edit{display:flex;align-items:center;gap:6px}
.task-line.edit input{flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff}
.task-line.edit input.task-en{flex:0.8;color:var(--sub)}
.task-line .tno{color:var(--sub);width:18px;text-align:right;flex-shrink:0}
.lvseg.tasklv button{width:26px;height:23px;font-size:11px}
/* スキル本体に表示する「タスク平均点」 */
.avgbox{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;
  border-radius:8px;padding:3px 6px;line-height:1.2}
.avgbox b{font-size:15px}
.avgbox span{font-size:10px;opacity:.8}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
footer{text-align:center;color:var(--sub);font-size:11px;padding:16px}
#toast{position:fixed;bottom:18px;right:18px;background:#4a352d;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.err{background:var(--danger)}
.login-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:30px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(74,53,45,.12)}
.login-card h2{font-size:18px;margin-bottom:4px}
.login-card .muted{margin-bottom:16px}
.login-card input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;font-size:14px}
.login-card .btn{width:100%;padding:10px}
.login-msg{font-size:12px;margin-top:10px;color:var(--danger)}
.login-msg.ok{color:var(--ok)}
@media(max-width:700px){.formgrid{grid-template-columns:1fr}}
@media print{aside#sidebar,#sbToggle,.toolbar,button{display:none!important}}
</style>
</head>
<body>
<button id="sbToggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div class="app" id="app">
  <aside id="sidebar"></aside>
  <div class="content">
    <main id="main"><div class="login-wrap"><div class="muted">読み込み中…</div></div></main>
    <footer>データは Supabase（東京リージョン）に保存されます。アクセスには登録済みメールでのログインが必要です。</footer>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ============================================================
   KMT HR Management System — cloud edition (Supabase backend)
   ============================================================ */
const SUPABASE_URL = 'https://brktkgkbmcqubeuhehpv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wv0PLH_4hHIt_lCnA6_ZHA_D_jpF1Zd';
// ログイン状態を保持する設定。
// persistSession   : セッションを localStorage に保存し、タブを閉じても残す

// 注意: 保存先はブラウザごと・URLごと。公開URLとローカルファイルでは別扱いになるため、

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    storage: window.localStorage,
    storageKey: 'kmt-hr-auth',

});

const DEFAULT_DOC_TEMPLATES = [

function uid(){ return crypto.randomUUID(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ return d?d:'—'; }
function today(){ return new Date().toISOString().slice(0,10); }
function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  return Math.ceil((d - new Date(new Date().toDateString()))/86400000);
}
function empById(id){ return data.employees.find(e=>e.id===id); }

async function q(promise){

/* 書き込みガード：権限の無いユーザーの insert/update/upsert/delete を画面側でも遮断する。
   本来の防御は Supabase 側の RLS（サーバー側）。ここは二重の安全網。 */
const _sbFrom = sb.from.bind(sb);
sb.from = function(table){
  const b = _sbFrom(table);
  ['insert','update','upsert','delete'].forEach(m=>{
    if(typeof b[m] !== 'function') return;
    const orig = b[m].bind(b);
    b[m] = function(){
      const need = WRITE_RANK[table] != null ? WRITE_RANK[table] : 2;
      if(myRank() < need){
        const blocked = Promise.resolve({data:null, error:{message:denyMsg()}});
        ['select','eq','neq','in','match','single','order','limit'].forEach(k=>{ blocked[k] = ()=>blocked; });
        return blocked;
      }
      return orig.apply(b, arguments);
    };
  });
  return b;
};

async function loadAll(){

    q(sb.from('departments').select('*').order('sort_order')),

    q(sb.from('skill_defs').select('*').order('sort_order')),

  ]);

  data.employees = emps.map(dbToEmp);
  docs.forEach(r=>{

/* ---------------- doc logic ---------------- */
function empTags(emp){
  const t = [];
  if(emp.employmentType==='海外リモート'||emp.employmentType==='業務委託') t.push('ov');
  else if(emp.employmentType==='パートタイム') t.push('pt');
  if(emp.isForeign && !t.includes('ov')) t.push('fr');
  if(!emp.isForeign && !t.includes('ov')) t.push('jp');
  if(emp.socialIns) t.push('ins');
  return t;
}
function docApplies(tpl, emp){
  if(tpl.tags.includes('all')) return true;
  const tags = empTags(emp);
  return tpl.tags.some(t=>tags.includes(t));
}
function docsForEmp(emp){ return data.docTemplates.filter(t=>docApplies(t,emp)); }
function docStateRead(emp, docId){
  return (emp.docs && emp.docs[docId]) || {status:'未依頼', date:'', note:''};
}
function docProgress(emp){
  const docs = docsForEmp(emp);
  const relevant = docs.filter(t=>docStateRead(emp,t.id).status!=='対象外');
  if(!relevant.length) return {done:0,total:0,pct:100};
  const done = relevant.filter(t=>docStateRead(emp,t.id).status==='確認済').length;
  return {done, total:relevant.length, pct:Math.round(done/relevant.length*100)};
}

/* ---------------- alerts ---------------- */
function fmtDays(d){ return d<0? `期限切れ・${-d}日超過` : `あと${d}日`; }
function buildAlerts(){
  const alerts = [];
  data.employees.filter(e=>e.status!=='退職').forEach(e=>{
    if(e.isForeign && e.zairyuExpiry){
      const d = daysUntil(e.zairyuExpiry);
      if(d!==null && d<=90) alerts.push({level:d<=30?'red':'yellow', emp:e, text:`在留期限 ${e.zairyuExpiry}（${fmtDays(d)}）— 期限3ヶ月前から更新申請可`, sort:d});
    }
    if(e.passportExpiry){
      const d = daysUntil(e.passportExpiry);
      if(d!==null && d<=180) alerts.push({level:d<=60?'red':'yellow', emp:e, text:`パスポート期限 ${e.passportExpiry}（${fmtDays(d)}）`, sort:d});
    }
    if(e.toritsugiExpiry){
      const d = daysUntil(e.toritsugiExpiry);
      if(d!==null && d<=90) alerts.push({level:d<=30?'red':'yellow', emp:e, text:`取次者証期限 ${e.toritsugiExpiry}（${fmtDays(d)}）— 更新手続き要確認`, sort:d});
    }
    if(e.contractEnd){
      const d = daysUntil(e.contractEnd);
      if(d!==null && d<=60) alerts.push({level:d<=14?'red':'yellow', emp:e, text:`契約終了日 ${e.contractEnd}（${fmtDays(d)}）— 更新手続き要確認`, sort:d});
    }
    if(e.probationEnd){
      const d = daysUntil(e.probationEnd);
      if(d!==null && d>=0 && d<=30) alerts.push({level:'blue', emp:e, text:`試用期間終了 ${e.probationEnd}（あと${d}日）`, sort:d});
    }
    const pr = docProgress(e);
    if(pr.total>0 && pr.pct<100 && e.status==='内定'){
      const pend = pr.total - pr.done;
      alerts.push({level:'blue', emp:e, text:`入社書類 未完了 ${pend}件（${pr.pct}%完了）`, sort:500+pend});
    }
  });
  alerts.sort((a,b)=>a.sort-b.sort);
  return alerts;
}

  if(verWatchStarted) return;

/* 新しいDBで初回ログインしたとき、書類マスタと部署マスタを自動投入する */
async function autoSeed(){
  if(myRank()<2) return;
  try{
    if(!data.docTemplates.length){
      await q(sb.from('doc_templates').insert(DEFAULT_DOC_TEMPLATES));
      data.docTemplates = DEFAULT_DOC_TEMPLATES.map(t=>Object.assign({}, t));
    }
    if(!data.departments.length){
      const defs = Object.keys(DEPT_ROLE);
      await q(sb.from('departments').insert(defs.map((n,i)=>({name:n, sort_order:i+1}))));
      data.departments = defs.slice();
    }
  }catch(e){ /* 初期化に失敗しても通常の利用は継続する */ }
}

async function login(){
  const email = document.getElementById('lg_email').value.trim();
  const pass = document.getElementById('lg_pass').value;
  if(!email||!pass){ document.getElementById('lg_msg').textContent='メールとパスワードを入力してください'; return; }
  const {data:d, error} = await sb.auth.signInWithPassword({email, password:pass});
  if(error){ document.getElementById('lg_msg').textContent = 'ログイン失敗：'+error.message; return; }
  session = d.session;
  await start();
}
async function signup(){
  const email = document.getElementById('lg_email').value.trim();
  const pass = document.getElementById('lg_pass').value;
  if(!email||!pass){ document.getElementById('lg_msg').textContent='メールとパスワード（6文字以上）を入力してください'; return; }
  const {error} = await sb.auth.signUp({email, password:pass});
  if(error){
    // 許可リスト（allowed_users）に無いメールはDB側で新規登録を拒否している
    const msg = /signup_not_allowed/.test(error.message)
      ? '登録失敗：このメールアドレスは利用を許可されていません。全体管理者に「ユーザー管理」への追加を依頼してください。'
      : '登録失敗：'+error.message;
    document.getElementById('lg_msg').textContent = msg;
    return;
  }
  showLogin('確認メールを送信しました。メール内のリンクをクリックしてから、ここでログインしてください。', true);
}

  await sb.auth.signOut();

/* --- 1) アプリの更新検知 ---
   公開中のindex.htmlを取得して APP_VER を比べる。変わっていれば「新しいバージョン」を案内する。
   （GitHub Pagesは静的配信のため、ページ自身を読み直すのが最も確実） */
let newVerAvailable = '';
async function checkAppVersion(){
  try{
    const res = await fetch(location.pathname + '?vcheck=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const txt = await res.text();
    const m = txt.match(/APP_VER\s*=\s*'([^']+)'/);
    if(m && m[1] && m[1] !== APP_VER){
      if(newVerAvailable !== m[1]){ newVerAvailable = m[1]; renderNav(); toast('新しいバージョンがあります'); }
    }
  }catch(e){ /* オフライン等は無視して次回に任せる */ }
}

/* イニシャルアバター（顔写真の代わり）。名前から色を決めて安定させる */
/* アバターの色。人を見分けるために「あえて」色相を散らしている
   （テーマ色に揃えると全員同じ色になり判別できないため） */
const AVATAR_COLORS = ['#c2410c','#1e7e4e','#b7791f','#7c3aed','#0e7490','#a8324a','#4d7c0f','#3f4d8a'];
function avatarOf(e, cls){
  const src = (e.nameRoma||e.nameKanji||'?').trim();
  const parts = src.split(/\s+/);
  let ini;
  if(/^[\x20-\x7e]+$/.test(src)){ // ローマ字 → 先頭2語の頭文字
    ini = parts.slice(0,2).map(w=>w[0]).join('').toUpperCase();
  } else {
    ini = src.replace(/\s/g,'').slice(0,2); // 漢字・かな → 先頭2文字
  }
  let h=0; for(const ch of src) h=(h*31+ch.charCodeAt(0))>>>0;
  const col = AVATAR_COLORS[h % AVATAR_COLORS.length];
  return `<div class="avatar ${cls||''}" style="background:${col}">${esc(ini)}</div>`;
}
function isFamilyRec(e){ return (e.position||'')==='家族（社員外）'; }

/* タスクごとの評価（0=未評価, 1〜5） */
function taskLevelOf(empId, skillId, taskId){
  const m = data.empSkills[empId];
  const tl = m && m[skillId] ? (m[skillId].taskLevels||{}) : {};
  return tl[taskId] || 0;
}
/* スキルの点数。タスクがあるスキルは「評価済タスクの平均」で決まる。
   タスクが無いスキルは従来どおり直接入力した値を使う。 */
function skillScore(empId, skillId){
  const s = data.skillDefs.find(x=>x.id===skillId);
  const tasks = (s && s.tasks) || [];
  if(tasks.length){
    const lv = tasks.map(t=>taskLevelOf(empId, skillId, t.id)).filter(v=>v>0);
    return {avg: lv.length? lv.reduce((a,b)=>a+b,0)/lv.length : 0,
            rated: lv.length, total: tasks.length, byTask:true};
  }
  const m = data.empSkills[empId];
  const direct = m && m[skillId] ? m[skillId].level : 0;
  return {avg: direct, rated: direct?1:0, total: 1, byTask:false};
}

function catAverages(empId){
  return skillCats().map(cat=>{
    const defs = data.skillDefs.filter(s=>s.category===cat);
    const sum = defs.reduce((a,s)=>a+skillLevelOf(empId,s.id),0);
    return {cat, avg: defs.length? sum/defs.length : 0};
  });
}

/* レーダーチャート（SVG）。labels/values は同じ長さ、max=5 */
function radarSvg(labels, values, size, opts){
  const o = opts||{};
  const n = labels.length; if(n<3) return '';
  const max = o.max||5, cx=size/2, cy=size/2, r=size/2 - (o.pad!=null?o.pad:30);
  const pt = (i,v)=>{ const a = -Math.PI/2 + i*2*Math.PI/n; const rr=r*v/max;
    return [cx+rr*Math.cos(a), cy+rr*Math.sin(a)]; };
  let grid='';
  for(let g=1; g<=max; g++){
    grid += `<polygon points="${labels.map((_,i)=>pt(i,g).map(x=>x.toFixed(1)).join(',')).join(' ')}"
      fill="none" stroke="${g===max?'#dcc9c1':'#f1e5e0'}" stroke-width="1"/>`;
  }
  const axes = labels.map((_,i)=>{ const [x,y]=pt(i,max);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#f1e5e0"/>`; }).join('');
  const poly = labels.map((_,i)=>pt(i,values[i]).map(x=>x.toFixed(1)).join(',')).join(' ');
  const dots = labels.map((_,i)=>{ const [x,y]=pt(i,values[i]);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="#b8492e"/>`; }).join('');
  const texts = labels.map((l,i)=>{ const a=-Math.PI/2 + i*2*Math.PI/n;
    const x=cx+(r+13)*Math.cos(a), y=cy+(r+13)*Math.sin(a);
    const anchor = Math.abs(Math.cos(a))<.3?'middle':(Math.cos(a)>0?'start':'end');
    return `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${anchor}"
      font-size="${o.fs||10}" fill="#6b7280">${esc(l)}</text>`; }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${grid}${axes}
    <polygon points="${poly}" fill="rgba(207,89,64,.22)" stroke="#b8492e" stroke-width="1.5"/>
    ${dots}${texts}</svg>`;
}
function empRadar(empId, size, fs){
  const cats = catAverages(empId);
  return radarSvg(cats.map(c=>catShort(c.cat)), cats.map(c=>c.avg), size||160, {fs:fs||10});
}

/* ---------------- スキル管理 ---------------- */
function skillTargets(){
  return scopeEmps(data.employees).filter(e=>e.status!=='退職' && !isFamilyRec(e))
    .sort((a,b)=>(a.empNo||'zzz').localeCompare(b.empNo||'zzz'));
}
function viewSkills(){
  if(myRank()<1) return `<div class="panel"><h2>閲覧権限がありません</h2></div>`;
  const subs = [['map','スキルマップ'],['input','個人スキル'],['summary','組織サマリー']];
  if(canEdit()) subs.push(['master','スキルマスタ']);
  if(!subs.some(s=>s[0]===skillSub)) skillSub='map';
  const lvLegend = Object.entries(SKILL_LEVELS).filter(([k])=>k>0)
    .map(([k,v])=>`${k}=${v}${skillLangEn?` / ${SKILL_LEVELS_EN[k]}`:''}`).join('　');
  const nav = `<div class="toolbar">
    <div class="viewseg">
      ${subs.map(([k,l,e])=>`<button class="${skillSub===k?'active':''}" onclick="skillSub='${k}';render()">${l}</button>`).join('')}
    </div>
    <label class="langtoggle" title="日本語の横に英語を併記します（外国籍スタッフ向け）">
      <input type="checkbox" ${skillLangEn?'checked':''} onchange="toggleSkillLang(this.checked)"> 🌐 English
    </label>
    <div class="spacer"></div>
    <span class="muted">レベル：${lvLegend}</span>
  </div>`;
  let body='';
  if(skillSub==='map') body = skillMapHtml();
  else if(skillSub==='input') body = skillInputHtml();
  else if(skillSub==='summary') body = skillSummaryHtml();
  else if(skillSub==='master') body = skillMasterHtml();
  return `<div class="panel">
    <h2>スキル管理 <span class="en">Skill Map — 誰が・何を・どのレベルでできるかを見える化</span></h2>
    ${nav}${body}
  </div>`;
}
function skillMapHtml(){
  const emps = skillTargets();

  const catRow = cats.map(c=>{
    const n = data.skillDefs.filter(s=>s.category===c).length;
    const en = catEn(c);
    return `<th class="cat" colspan="${n}">${esc(c)}${skillLangEn&&en?`<br><span class="en">${esc(en)}</span>`:''}</th>`; }).join('');
  const skillRow = data.skillDefs.map(s=>{
    const tip = [s.name, s.name_en, s.description, s.description_en].filter(Boolean).join(' / ');
    return `<th title="${esc(tip)}" style="writing-mode:vertical-rl;text-orientation:mixed;padding:8px 3px;font-weight:600">${esc(s.name)}${
      skillLangEn&&s.name_en?`<span class="en" style="margin-top:4px">${esc(s.name_en)}</span>`:''}</th>`; }).join('');
  const rows = emps.map(e=>{

                  (sc.byTask? `（評価済タスク ${sc.rated}/${sc.total}）` : '');
      return `<td><span class="sklv lv${r}" title="${esc(tip)}">${fmtScore(sc.avg)}</span></td>`;

    const avg = withLv.length? (withLv.reduce((a,b)=>a+b,0)/withLv.length) : 0;
    return `<td class="muted" style="font-weight:700">${fmtScore(avg)}</td>`; }).join('');

/* 英語欄などをその場で保存する */
async function updateSkillDef(id, field, value){
  if(!canEdit()){ toast(denyMsg(), true); return; }
  const s = data.skillDefs.find(x=>x.id===id);
  if(!s || (s[field]||'') === value) return;
  const patch = {}; patch[field] = value;
  await q(sb.from('skill_defs').update(patch).eq('id', id));
  s[field] = value;
  /* カテゴリ英語は同じカテゴリ全体に反映させる（表示は先頭行を参照するため） */
  if(field==='category_en'){
    data.skillDefs.filter(x=>x.category===s.category).forEach(x=>{ x.category_en = value; });
    await q(sb.from('skill_defs').update({category_en:value}).eq('category', s.category));
  }
  render(); toast('保存しました');
}
/* スキル配下のタスクリスト。管理者はその場で追加・編集・削除できる */

    }).join('')}</span>`;

    return `<div class="task-block">
      ${editable? `<div class="task-line edit">
        <span class="tno">＋</span>

             <input value="${esc(t.en||'')}" placeholder="English" class="task-en" onchange="updateTask('${s.id}',${i},'en',this.value)">`
          : `<span style="flex:1">${esc(t.jp)}</span>
             ${skillLangEn&&t.en?`<span class="en" style="flex:0.8">${esc(t.en)}</span>`:''}`}
        ${scoreSeg(t)}
        ${editable?`<button class="btn small ghost" title="削除" onclick="delTask('${s.id}',${i})">✕</button>`:''}
      </div>`).join('')}
    ${editable? `<div class="task-line edit">
      <span class="tno">＋</span>
      <input id="newTaskJp-${s.id}" placeholder="新しいタスク（日本語）">
      <input id="newTaskEn-${s.id}" placeholder="English (optional)" class="task-en">
      <button class="btn small" onclick="addTask('${s.id}')">追加</button>
    </div>`:''}
  </div>`;

/* タスクの点数を保存し、スキル本体の平均も再計算して保存する */
async function setTaskLevel(skillId, taskId, level){
  if(!canEdit()){ toast(denyMsg(), true); return; }
  const empId = skillEmpId;
  if(!data.empSkills[empId]) data.empSkills[empId] = {};
  const cur = data.empSkills[empId][skillId] || {level:0, note:'', taskLevels:{}};
  const tl = Object.assign({}, cur.taskLevels||{});
  if(level>0) tl[taskId] = level; else delete tl[taskId];
  /* スキル本体の level には平均を四捨五入して入れる（集計や旧データとの互換のため） */
  const s = data.skillDefs.find(x=>x.id===skillId);
  const vals = ((s&&s.tasks)||[]).map(t=>tl[t.id]||0).filter(v=>v>0);
  const avg = vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
  const rounded = Math.round(avg);
  await q(sb.from('employee_skills').upsert(
    {employee_id:empId, skill_id:skillId, level:rounded, task_levels:tl, updated_at:new Date().toISOString()}));
  data.empSkills[empId][skillId] = {level:rounded, note:cur.note||'', taskLevels:tl};
  render();
}
async function saveTasks(skillId){
  const s = data.skillDefs.find(x=>x.id===skillId); if(!s) return;
  await q(sb.from('skill_defs').update({tasks:s.tasks||[]}).eq('id', skillId));
}
async function updateTask(skillId, idx, field, value){
  if(!canEdit()){ toast(denyMsg(), true); return; }
  const s = data.skillDefs.find(x=>x.id===skillId);
  if(!s || !s.tasks || !s.tasks[idx]) return;
  s.tasks[idx][field] = value.trim();
  await saveTasks(skillId);
  toast('保存しました');
}
async function addTask(skillId){
  if(!canEdit()){ toast(denyMsg(), true); return; }
  const jp = document.getElementById('newTaskJp-'+skillId).value.trim();
  const en = document.getElementById('newTaskEn-'+skillId).value.trim();
  if(!jp){ toast('タスク（日本語）を入力してください', true); return; }
  const s = data.skillDefs.find(x=>x.id===skillId); if(!s) return;
  s.tasks = s.tasks||[];
  /* 既存IDと衝突しない連番IDを付ける（採点はこのIDに紐づく） */
  let n = s.tasks.length + 1;
  while(s.tasks.some(t=>t.id === s.id+'-t'+n)) n++;
  s.tasks.push({id: s.id+'-t'+n, jp, en});
  await saveTasks(skillId);
  render(); toast('タスクを追加しました');
}
async function delTask(skillId, idx){
  if(!canEdit()){ toast(denyMsg(), true); return; }
  const s = data.skillDefs.find(x=>x.id===skillId);
  if(!s || !s.tasks || !s.tasks[idx]) return;
  if(!confirm(`タスク「${s.tasks[idx].jp}」を削除しますか？`)) return;
  s.tasks.splice(idx,1);
  await saveTasks(skillId);
  render(); toast('削除しました');
}
async function setSkillLevel(empId, skillId, level){
  if(!canEdit()){ toast(denyMsg(), true); return; }
  await q(sb.from('employee_skills').upsert(
    {employee_id:empId, skill_id:skillId, level, updated_at:new Date().toISOString()}));
  if(!data.empSkills[empId]) data.empSkills[empId] = {};
  data.empSkills[empId][skillId] = {level, note:(data.empSkills[empId][skillId]||{}).note||''};
  render();
}
async function addSkillDef(){
  const v = id => document.getElementById(id).value.trim();
  const cat = v('skCat'), name = v('skName');
  if(!cat || !name){ toast('カテゴリとスキル名を入力してください', true); return; }
  const maxOrder = Math.max(0, ...data.skillDefs.map(s=>s.sort_order||0));
  const def = {id:'sk-'+uid().slice(0,8), category:cat, name,
    category_en: v('skCatEn') || catEn(cat), name_en: v('skNameEn'),
    description: v('skDesc'), description_en: v('skDescEn'), sort_order:maxOrder+1, tasks:[]};
  await q(sb.from('skill_defs').insert(def));
  data.skillDefs.push(def);
  render(); toast('スキルを追加しました');
}
async function delSkillDef(id){
  const s = data.skillDefs.find(x=>x.id===id);
  if(!confirm(`スキル「${s?s.name:''}」を削除しますか？全社員のレベル記録も消えます。`)) return;
  await q(sb.from('skill_defs').delete().eq('id', id));
  data.skillDefs = data.skillDefs.filter(x=>x.id!==id);
  Object.values(data.empSkills).forEach(m=>{ delete m[id]; });
  render(); toast('削除しました');
}
async function resetSkillDefs(){
  if(!confirm('スキルマスタを初期テンプレート（23項目・タスク付き）に戻しますか？\n追加した独自スキルと、そのレベル記録は削除されます。')) return;
  /* タスクには安定したIDを振る（採点はこのIDに紐づくため） */
  const defs = DEFAULT_SKILL_DEFS.map(s=>Object.assign({}, s, {
    tasks: (DEFAULT_SKILL_TASKS[s.id]||[]).map((t,i)=>({id:`${s.id}-t${i+1}`, jp:t.jp, en:t.en}))
  }));
  await q(sb.from('skill_defs').delete().neq('id',''));
  await q(sb.from('skill_defs').insert(defs));
  await loadAll(); render(); toast('初期テンプレートに戻しました');
}

async function setDoc(empId, docId, field, val){
  const e = empById(empId); if(!e) return;
  if(!e.docs[docId]) e.docs[docId] = {status:'未依頼', date:'', note:''};
  const st = e.docs[docId];
  st[field]=val;
  if(field==='status' && (val==='受領'||val==='確認済') && !st.date) st.date = today();
  await q(sb.from('employee_docs').upsert({employee_id:empId, doc_id:docId, status:st.status, date:dOrNull(st.date), note:st.note||''}));
  render();
}

async function saveEmp(id, isNew){

    nameKanji:g('f_nameKanji'), nameKana:g('f_nameKana'), nameRoma:g('f_nameRoma'),
    birthDate:g('f_birth'), gender:g('f_gender'), nationality:g('f_nat'),
    isForeign:g('f_isForeign')==='1', department:document.getElementById('f_dept').value, position:g('f_pos'),
    hireDate:g('f_hire'), probationEnd:g('f_prob'), contractEnd:g('f_cend'), resignDate:g('f_resign'),

    emergencyName:g('f_emName'), emergencyRelation:g('f_emRel'), emergencyPhone:g('f_emPhone'),
    socialIns:g('f_socIns')==='1', empInsNo:g('f_empIns'), pensionNo:g('f_pension'),
    myNumberCollected:g('f_myNum')==='1',
    zairyuStatus:document.getElementById('f_zStatus').value, zairyuCardNo:g('f_zCard'), zairyuExpiry:g('f_zExp'),

  });
  if(!e.nameKanji && !e.nameRoma){ alert('氏名（漢字またはローマ字）を入力してください'); return; }
  await q(sb.from('employees').upsert(empToDb(e)));

  closeModal(); currentEmpId = e.id; view='employees'; render();

async function deleteEmp(id){
  if(!confirm('この従業員データを削除しますか？（書類記録・評価も削除、KPI・資産の紐付けは解除されます）')) return;
  await q(sb.from('employees').delete().eq('id', id));
  data.employees = data.employees.filter(e=>e.id!==id);
  data.evaluations = data.evaluations.filter(v=>v.empId!==id);
  data.kpis.forEach(k=>{ if(k.empId===id) k.empId=''; });
  data.assets.forEach(a=>{ if(a.assignedTo===id){ a.assignedTo=''; if(a.status==='貸与中')a.status='在庫'; }});
  toast('削除しました');
  closeModal(); currentEmpId=null; render();
}

/* ---------------- evaluations（評価シート2026新版） ---------------- */
function evalKpiCalc(k){
  const t = parseFloat(k.target), f = parseFloat(k.final);
  const adj = (k.adjusted!==''&&k.adjusted!=null)? parseFloat(k.adjusted) : NaN;
  if(!t || isNaN(f)) return {rate:null, auto:null, score: isNaN(adj)? null : adj};
  const rate = f/t;
  const auto = rate>=1.2?5 : rate>=1?4 : rate>=0.8?3 : rate>=0.6?2 : 1;
  return {rate, auto, score: isNaN(adj)? auto : adj};
}
function evalCalc(v){
  const wts = EVAL_ROLES[v.role] || EVAL_ROLES['紹介営業'];
  let wsum=0, ssum=0;
  (v.kpis||[]).forEach(k=>{
    const w = parseFloat(k.weight); const c = evalKpiCalc(k);
    if(w && c.score!=null){ wsum+=w; ssum+=w*c.score; }
  });
  const aSub = wsum? Math.round(ssum/wsum*100)/100 : null;
  const avg = arr => { const xs=arr.map(x=>parseFloat(x.mgr)).filter(x=>!isNaN(x)); return xs.length? Math.round(xs.reduce((s,x)=>s+x,0)/xs.length*100)/100 : null; };
  const bSub = avg(v.comps||[]);
  const cSub = avg(v.atts||[]);
  let total=null, rank='', coef='', band='';
  if(aSub!=null && bSub!=null && cSub!=null){
    total = Math.round((aSub*wts.a/100 + bSub*wts.b/100 + cSub*wts.c/100)*100)/100;
    for(const r of RANK_TABLE){ if(total>=r[0]){ rank=r[1]; coef=r[2]; band=r[3]; break; } }
  }
  return {wts, aSub, bSub, cSub, total, rank, coef, band};
}

/* カオナビ型：評価の進捗管理＋ランク分布（管理者以上） */
function evalProgressHtml(list){
  const total = list.length;
  const stCounts = EVAL_STATUSES.map(st=>({st, n:list.filter(v=>v.status===st).length}));
  const done = list.filter(v=>v.status==='確定').length;
  const pct = total? Math.round(done*100/total) : 0;
  const ranks = {};
  list.forEach(v=>{ const c=evalCalc(v); if(c.rank) ranks[c.rank]=(ranks[c.rank]||0)+1; });
  const maxR = Math.max(1, ...GRADES.map(g=>ranks[g]||0));
  const RANK_COLORS = {S:'#1e7e4e', A:'#4d9e6f', B:'#b8492e', C:'#b7791f', D:'#c0392b'};
  const pending = list.filter(v=>v.status!=='確定');
  return `
  <div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:14px;align-items:start">
    <div class="fieldset" style="margin:0">
      <legend>進捗管理${evalPeriodFilter?`（${esc(evalPeriodFilter)}）`:'（全期間）'}</legend>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <div class="progress" style="flex:1"><div style="width:${pct}%"></div></div>
        <b>${done}/${total} 確定（${pct}%）</b>
      </div>
      <div class="tag-row">
        ${stCounts.map(x=>`<span class="badge ${x.st==='確定'?'b-green':x.n?'b-yellow':'b-gray'}">${x.st} ${x.n}</span>`).join('')}
      </div>
      ${pending.length? `<div class="muted" style="margin-top:8px">未確定：${pending.slice(0,8).map(v=>esc(empName(v.empId))).join('、')}${pending.length>8?` 他${pending.length-8}名`:''}</div>`:''}
    </div>
    <div class="fieldset" style="margin:0">
      <legend>ランク分布（自動計算）</legend>
      ${GRADES.map(g=>{ const n=ranks[g]||0; return `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px">
          <b style="width:16px">${g}</b>
          <div style="flex:1;background:#f8efeb;border-radius:5px;height:16px;overflow:hidden">
            <div style="width:${n*100/maxR}%;height:100%;background:${RANK_COLORS[g]}"></div>
          </div>
          <span style="width:34px;text-align:right">${n}名</span>
        </div>`; }).join('')}
      <div class="muted" style="margin-top:4px">点数入力済みのシートのみ集計されます。</div>
    </div>
  </div>`;
}
async function bulkCreateEvals(){

  const created = [];

    if(!data.evaluations.some(v=>v.empId===e.id && v.period===period)){

async function saveEval(isNew){
  const v = window._evalDraft;
  v.empId = document.getElementById('ev_emp').value;
  v.period = document.getElementById('ev_period').value.trim();
  v.role = document.getElementById('ev_role').value;
  v.evaluator = document.getElementById('ev_evaluator').value.trim();
  v.status = document.getElementById('ev_status').value;
  v.sdReason = document.getElementById('ev_sd').value;
  v.midReview = document.getElementById('ev_mid').value;
  v.finalMeeting = document.getElementById('ev_fin').value;
  v.empComment = document.getElementById('ev_emp_c').value;
  if(!v.empId || !v.period){ alert('対象者と評価期間を入力してください'); return; }
  const wsum = (v.kpis||[]).reduce((s,k)=>s+(parseFloat(k.weight)||0),0);
  if(wsum && wsum!==100 && !confirm(`KPIのウェイト合計が${wsum}%です（推奨100%）。このまま保存しますか？`)) return;
  const c = evalCalc(v);
  if((c.rank==='S'||c.rank==='D') && !v.sdReason.trim() && !confirm(`ランク${c.rank}には理由の記載が必須です。理由なしで保存しますか？`)) return;
  v.finalGrade = c.rank || '';
  await q(sb.from('evaluations').upsert(evalToDb(v)));
  if(isNew) data.evaluations.push(v);
  else{ const i = data.evaluations.findIndex(x=>x.id===v.id); if(i>=0) data.evaluations[i]=v; }
  toast('保存しました' + (c.rank? `（総合${c.total}・ランク${c.rank}）`:''));
  closeModal(); render();
}
async function deleteEval(id){
  if(!confirm('この評価シートを削除しますか？')) return;
  await q(sb.from('evaluations').delete().eq('id', id));
  data.evaluations = data.evaluations.filter(v=>v.id!==id);
  toast('削除しました');
  closeModal(); render();
}

/* ---------------- KPI ---------------- */
/* 達成率。「少ないほど良い」KPI（退職者数など）は 目標/実績 で計算するため、
   実績が目標を下回るほど100%を超える。 */
function kpiRate(k){
  const t = parseFloat(k.target);
  const a = (k.records||[]).reduce((s,r)=>s+(parseFloat(r.actual)||0),0);
  if(!t) return null;
  if(k.lowerBetter) return a<=0 ? 200 : Math.round(t/a*100);
  return Math.round(a/t*100);
}
function kpiActual(k){ return (k.records||[]).reduce((s,r)=>s+(parseFloat(r.actual)||0),0); }
function viewKpi(){
  const visible = myRank()>=2 ? data.kpis : data.kpis.filter(k=>k.scope!=='個人' || canSeeEmp(k.empId));
  const periods = [...new Set(visible.map(k=>k.period))].sort().reverse();
  let list = visible.slice();
  if(kpiPeriodFilter) list = list.filter(k=>k.period===kpiPeriodFilter);
  return `
  <div class="panel">
    <h2>KPI管理 <span class="en">会社・部署・個人のKPIと実績</span></h2>
    <div class="toolbar">
      <select onchange="kpiPeriodFilter=this.value;render()">
        <option value="">全期間</option>
        ${periods.map(p=>`<option ${kpiPeriodFilter===p?'selected':''}>${esc(p)}</option>`).join('')}
      </select>
      <div class="spacer"></div>
      ${canEdit()? '<button class="btn" onclick="openKpiForm()">＋ KPI登録</button>' : '<span class="muted">閲覧のみの権限です</span>'}
    </div>
    ${KPI_SCOPES.map(sc=>{
      const rows = list.filter(k=>k.scope===sc);
      if(!rows.length) return '';
      /* 担当（部署・チーム・個人）ごとにまとめて見せる */
      const groups = [...new Set(rows.map(k=> sc==='個人'? empName(k.empId) : (k.dept||'—')))];
      return `<div class="section-title">${sc==='全社'?'🏢 全体目標':sc==='部署'?'🏬 部署目標':sc==='チーム'?'🌏 国籍チーム目標':'👤 個人目標'}
        <span class="en">${rows.length}件</span></div>
      <div class="tablewrap"><table>
        <tr><th>${sc==='全社'?'期間':'担当'}</th><th>KPI名</th><th>目標</th><th>実績累計</th><th>達成率</th></tr>
        ${groups.map(g=>{
          const gr = rows.filter(k=> (sc==='個人'? empName(k.empId) : (k.dept||'—')) === g);
          return gr.map((k,i)=>{
            const rate = kpiRate(k);
            const good = rate!==null && rate>=100, warn = rate!==null && rate>=70;
            return `<tr class="clickable" onclick="openKpiForm('${k.id}')">
              <td>${i===0? (sc==='全社'? esc(k.period) : `<b>${esc(g)}</b>`) : ''}</td>
              <td>${esc(k.name)}${k.lowerBetter?' <span class="badge b-gray" title="少ないほど良いKPI">↓良</span>':''}
                ${k.notes?`<br><span class="muted">${esc(k.notes)}</span>`:''}</td>
              <td>${k.lowerBetter?'≤ ':''}${esc(k.target)} ${esc(k.unit)}</td>
              <td>${kpiActual(k)} ${esc(k.unit)}</td>
              <td>${rate===null?'—':`<div style="display:flex;align-items:center;gap:8px">
                <div class="progress" style="flex:1;min-width:60px"><div style="width:${Math.min(rate,100)}%;background:${good?'var(--ok)':warn?'var(--accent)':'var(--warn)'}"></div></div>
                <b style="color:${good?'var(--ok)':warn?'var(--text)':'var(--danger)'}">${rate}%</b></div>`}</td>
            </tr>`;
          }).join('');
        }).join('')}
      </table></div>`;
    }).join('') || '<div class="muted">KPIが登録されていません。例：特定技能 支援対象者数、紹介成約数、面談実施数、定期報告提出率…</div>'}
  </div>`;
}

async function saveKpi(isNew){
  const k = window._kpiDraft;
  k.period = document.getElementById('kp_period').value.trim();

  k.empId = k.scope==='個人'? document.getElementById('kp_emp').value : '';
  k.dept = (k.scope==='部署'||k.scope==='チーム')? document.getElementById('kp_dept').value : '';
  k.name = document.getElementById('kp_name').value.trim();
  k.target = document.getElementById('kp_target').value;
  k.unit = document.getElementById('kp_unit').value.trim();
  k.lowerBetter = document.getElementById('kp_lower').value === '1';
  k.notes = document.getElementById('kp_notes').value;
  if(!k.name){ alert('KPI名を入力してください'); return; }
  await q(sb.from('kpis').upsert(kpiToDb(k)));
  if(isNew) data.kpis.push(k);
  else{ const i = data.kpis.findIndex(x=>x.id===k.id); if(i>=0) data.kpis[i]=k; }
  toast('保存しました');
  closeModal(); render();
}
async function deleteKpi(id){

  data.kpis = data.kpis.filter(k=>k.id!==id);

}

async function saveAsset(id, isNew){
  const g = i=>document.getElementById(i).value;
  let a = isNew? {id} : data.assets.find(x=>x.id===id);
  Object.assign(a,{
    assetNo:g('as_no').trim(), category:g('as_cat'), name:g('as_name').trim(), serial:g('as_serial').trim(),
    purchaseDate:g('as_pdate'), price:g('as_price'), status:g('as_status'),
    assignedTo:g('as_emp'), lendDate:g('as_lend'), returnDate:g('as_return'), notes:g('as_notes')
  });
  if(a.assignedTo && a.status==='在庫') a.status='貸与中';
  if(!a.assignedTo && a.status==='貸与中') a.status='在庫';
  if(!a.name){ alert('名称を入力してください'); return; }
  await q(sb.from('assets').upsert(assetToDb(a)));
  if(isNew) data.assets.push(a);
  toast('保存しました');
  closeModal(); render();
}
async function deleteAsset(id){
  if(!confirm('この資産を削除しますか？')) return;
  await q(sb.from('assets').delete().eq('id', id));
  data.assets = data.assets.filter(a=>a.id!==id);
  toast('削除しました');
  closeModal(); render();
}

async function addUser(){

  await q(sb.from('allowed_users').insert({email:em, display_name:name, role:role}));
  data.allowedUsers.push({email:em, name:name, role:role, addedAt:today()});
  render(); toast('追加しました');

async function setUserRole(em, role){
  if(!ROLES.includes(role)) return;

  await q(sb.from('allowed_users').update({role:role}).eq('email', em));
  const u = data.allowedUsers.find(x=>x.email===em);
  if(u) u.role = role;
  render(); toast(em+' を「'+role+'」に変更しました');
}
async function removeUser(em){

  if(!confirm(em+' のアクセス権を削除しますか？\n（ログインできなくなります）')) return;
  await q(sb.from('allowed_users').delete().eq('email', em));
  data.allowedUsers = data.allowedUsers.filter(x=>x.email!==em);
  render(); toast('削除しました');
}

/* ---------------- export / import ---------------- */
function download(filename, content, mime){
  const blob = new Blob([content], {type:mime||'application/octet-stream'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function exportJson(){
  const out = {
    version:3, exportedAt:new Date().toISOString(),
    departments:data.departments,
    docTemplates:data.docTemplates,
    employees:data.employees,
    evaluations:data.evaluations,
    kpis:data.kpis,
    assets:data.assets,
    skillDefs:data.skillDefs,
    empSkills:data.empSkills
  };
  download(`KMT-HR-backup-${today()}.json`, JSON.stringify(out, null, 1), 'application/json');
}
async function importJson(){
  if(!canAdmin()){ toast('取込（全置換）は「全体管理」権限のみ実行できます', true); return; }
  const f = document.getElementById('importFile').files[0];
  if(!f){ alert('JSONファイルを選択してください'); return; }
  const text = await f.text();
  let d;
  try{ d = JSON.parse(text); }catch(e){ alert('JSONの解析に失敗しました：'+e.message); return; }
  if(!d.employees || !Array.isArray(d.employees)){ alert('形式が違います（employeesがありません）'); return; }
  if(!confirm(`従業員${d.employees.length}名のデータを取り込みます。現在のSupabase上のデータは全て置き換えられます。よろしいですか？`)) return;
  if(!confirm('最終確認：現在のデータのバックアップは保存済みですか？実行します。')) return;
  toast('取込中…');
  try{
    // wipe
    await q(sb.from('assets').delete().neq('id','00000000-0000-0000-0000-000000000000'));
    await q(sb.from('kpis').delete().neq('id','00000000-0000-0000-0000-000000000000'));
    await q(sb.from('evaluations').delete().neq('id','00000000-0000-0000-0000-000000000000'));
    await q(sb.from('employees').delete().neq('id','00000000-0000-0000-0000-000000000000'));
    await q(sb.from('doc_templates').delete().neq('id',''));
    await q(sb.from('departments').delete().neq('name',''));
    // remap old (non-uuid) ids to uuids
    const isUuid = s=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s||'');
    const idMap = {};
    const mapId = old=>{ if(isUuid(old)) return old; if(!idMap[old]) idMap[old]=uid(); return idMap[old]; };
    // departments
    const deps = (d.departments||[]).map((name,i)=>({name, sort_order:i+1}));
    if(deps.length) await q(sb.from('departments').insert(deps));
    // doc templates
    const tpls = (d.docTemplates||DEFAULT_DOC_TEMPLATES).map((t,i)=>({id:t.id, stage:t.stage, name:t.name, tags:t.tags, note:t.note||'', sort_order:t.sort_order!=null?t.sort_order:i+1}));
    if(tpls.length) await q(sb.from('doc_templates').insert(tpls));
    // employees
    const emps = d.employees.map(e=>{ const ne = Object.assign({}, e, {id:mapId(e.id)}); return ne; });
    if(emps.length) await q(sb.from('employees').insert(emps.map(empToDb)));
    // employee docs
    const docRows = [];
    emps.forEach(e=>{
      Object.entries(e.docs||{}).forEach(([docId, st])=>{
        docRows.push({employee_id:e.id, doc_id:docId, status:st.status||'未依頼', date:dOrNull(st.date), note:st.note||''});
      });
    });
    if(docRows.length) await q(sb.from('employee_docs').insert(docRows));
    // evaluations
    const evals = (d.evaluations||[]).map(v=>Object.assign({}, v, {id:mapId(v.id), empId:mapId(v.empId)}));
    if(evals.length) await q(sb.from('evaluations').insert(evals.map(evalToDb)));
    // kpis
    const kpis = (d.kpis||[]).map(k=>Object.assign({}, k, {id:mapId(k.id), empId:k.empId?mapId(k.empId):''}));
    if(kpis.length) await q(sb.from('kpis').insert(kpis.map(kpiToDb)));
    // assets
    const assets = (d.assets||[]).map(a=>Object.assign({}, a, {id:mapId(a.id), assignedTo:a.assignedTo?mapId(a.assignedTo):''}));
    if(assets.length) await q(sb.from('assets').insert(assets.map(assetToDb)));
    // skills（v3以降のバックアップのみ。無ければ既定テンプレートを維持）
    if(Array.isArray(d.skillDefs) && d.skillDefs.length){
      await q(sb.from('skill_defs').delete().neq('id',''));
      await q(sb.from('skill_defs').insert(d.skillDefs));
      const skRows = [];
      Object.entries(d.empSkills||{}).forEach(([empId, m])=>{
        Object.entries(m).forEach(([skillId, v])=>{
          const tl = v.taskLevels||{};
          if(v.level>0 || Object.keys(tl).length)
            skRows.push({employee_id:mapId(empId), skill_id:skillId, level:v.level||0, note:v.note||'', task_levels:tl});
        });
      });

function printDoc(empId, key){
  const e = empById(empId); if(!e) return;
  const t = PRINT_DOCS[key]; if(!t) return;
  const w = window.open('', '_blank');
  if(!w){ alert('ポップアップがブロックされました。ブラウザの設定でこのサイトのポップアップを許可してください。'); return; }
  w.document.write(docShell(t.title, t.build(e)));
  w.document.close();
}

  <p class="muted" style="margin-bottom:10px">従業員詳細画面（従業員一覧→本人をクリック）右上の「📄書類作成」から、本人の情報が入った状態で出力できます。画面上で文面を直接編集し、「印刷/PDF保存」で仕上げてください。</p>
  <div class="tablewrap"><table>
    <tr><th>テンプレート</th><th>使う場面</th></tr>
    ${Object.values(PRINT_DOCS).map(d=>`<tr><td><b>${esc(d.title)}</b></td><td>${esc(d.stage)}</td></tr>`).join('')}
  </table></div>
  </div>`;
}

/* ---------------- modal ---------------- */
function modal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });

sb.auth.onAuthStateChange((event, s)=>{
  if(event==='SIGNED_OUT'){ session=null; showLogin(); return; }
  // トークン自動更新後も session を最新に保つ（古いトークンを持ち続けないため）
  if(s) session = s;
});
boot();
</script>
