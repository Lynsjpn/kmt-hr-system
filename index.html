<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --border:#dde3ea; --text:#1f2937; --sub:#6b7280;

}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:#12325e;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}

nav button:hover{background:rgba(255,255,255,.12);color:#fff}
nav button.active{background:#fff;color:#12325e}
nav .userchip{font-size:11px;color:#cdd9ea;margin-left:8px;border-left:1px solid rgba(255,255,255,.25);padding-left:12px}
main{max-width:1280px;margin:0 auto;padding:20px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.panel h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h2 .en{font-size:11px;color:var(--sub);font-weight:400}
.grid{display:grid;gap:12px}
.grid.cols4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid.cols3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.stat{background:var(--accent-soft);border-radius:var(--radius);padding:14px;text-align:center}
.stat .num{font-size:26px;font-weight:800;color:var(--accent)}
.stat .lbl{font-size:12px;color:var(--sub);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#eef2f7;text-align:left;padding:8px;border-bottom:2px solid var(--border);white-space:nowrap;font-size:12px}
td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:#f3f7fc}
.tablewrap{overflow-x:auto}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.b-blue{background:var(--accent-soft);color:var(--accent)}
.b-green{background:var(--ok-soft);color:var(--ok)}
.b-red{background:var(--danger-soft);color:var(--danger)}
.b-yellow{background:var(--warn-soft);color:var(--warn)}

button.btn{background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
button.btn:hover{filter:brightness(1.1)}
button.btn.secondary{background:#fff;color:var(--accent);border:1px solid var(--accent)}
button.btn.danger{background:var(--danger)}
button.btn.small{padding:4px 10px;font-size:12px}
button.btn.ghost{background:#fff;color:var(--sub);border:1px solid var(--border)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff}
.toolbar .spacer{flex:1}

.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 14px}
.formgrid label,.field label{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:3px}

.fieldset legend{font-size:12px;font-weight:700;color:var(--accent);padding:0 6px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.alert-item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:13px}
.alert-item.red{background:var(--danger-soft)}
.alert-item.yellow{background:var(--warn-soft)}
.alert-item.blue{background:var(--accent-soft)}

.muted{color:var(--sub);font-size:12px}
.section-title{font-size:13px;font-weight:800;color:var(--accent);margin:16px 0 8px;border-left:4px solid var(--accent);padding-left:8px}

.tag-row{display:flex;gap:6px;flex-wrap:wrap}
.progress{height:8px;background:#e5eaf1;border-radius:6px;overflow:hidden;min-width:80px}
.progress>div{height:100%;background:var(--ok)}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--sub);white-space:nowrap}
.kv dd{font-weight:600}
footer{text-align:center;color:var(--sub);font-size:11px;padding:16px}
#toast{position:fixed;bottom:18px;right:18px;background:#12325e;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.err{background:var(--danger)}
.login-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:30px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(18,50,94,.12)}

@media(max-width:700px){.formgrid{grid-template-columns:1fr}}
@media print{header nav,.toolbar,button{display:none!important}}
</style>
</head>

async function loadAll(){
  const [deps, tpls, emps, docs, evals, kpis, assets, allowed] = await Promise.all([
    q(sb.from('departments').select('*').order('sort_order')),
    q(sb.from('doc_templates').select('*').order('sort_order')),
    q(sb.from('employees').select('*')),
    q(sb.from('employee_docs').select('*')),
    q(sb.from('evaluations').select('*')),
    q(sb.from('kpis').select('*')),
    q(sb.from('assets').select('*')),
    q(sb.from('allowed_users').select('*').order('added_at')),
  ]);
  data.departments = deps.map(d=>d.name);
  data._deptRows = deps;
  data.docTemplates = tpls.map(t=>({id:t.id, stage:t.stage, name:t.name, tags:t.tags, note:t.note, sort_order:t.sort_order}));
  data.employees = emps.map(dbToEmp);
  docs.forEach(r=>{
    const e = empById(r.employee_id);
    if(e) e.docs[r.doc_id] = {status:r.status, date:r.date||'', note:r.note||''};
  });
  data.evaluations = evals.map(dbToEval);
  data.kpis = kpis.map(dbToKpi);
  data.assets = assets.map(dbToAsset);
  data.allowedUsers = allowed.map(a=>a.email);
}

function empTags(emp){
  const t = [];
  if(emp.employmentType==='海外リモート'||emp.employmentType==='業務委託') t.push('ov');
  else if(emp.employmentType==='パートタイム') t.push('pt');
  if(emp.isForeign && !t.includes('ov')) t.push('fr');
  if(!emp.isForeign && !t.includes('ov')) t.push('jp');
  if(emp.socialIns) t.push('ins');
  return t;
}
function docApplies(tpl, emp){
  if(tpl.tags.includes('all')) return true;
  const tags = empTags(emp);
  return tpl.tags.some(t=>tags.includes(t));
}
function docsForEmp(emp){ return data.docTemplates.filter(t=>docApplies(t,emp)); }
function docStateRead(emp, docId){
  return (emp.docs && emp.docs[docId]) || {status:'未依頼', date:'', note:''};
}
function docProgress(emp){
  const docs = docsForEmp(emp);
  const relevant = docs.filter(t=>docStateRead(emp,t.id).status!=='対象外');
  if(!relevant.length) return {done:0,total:0,pct:100};
  const done = relevant.filter(t=>docStateRead(emp,t.id).status==='確認済').length;
  return {done, total:relevant.length, pct:Math.round(done/relevant.length*100)};
}

/* ---------------- alerts ---------------- */
function buildAlerts(){
  const alerts = [];
  data.employees.filter(e=>e.status!=='退職').forEach(e=>{
    if(e.isForeign && e.zairyuExpiry){
      const d = daysUntil(e.zairyuExpiry);
      if(d!==null && d<=90) alerts.push({level:d<=30?'red':'yellow', emp:e, text:`在留期限 ${e.zairyuExpiry}（あと${d}日）— 期限3ヶ月前から更新申請可`, sort:d});
    }
    if(e.passportExpiry){
      const d = daysUntil(e.passportExpiry);
      if(d!==null && d<=180) alerts.push({level:d<=60?'red':'yellow', emp:e, text:`パスポート期限 ${e.passportExpiry}（あと${d}日）`, sort:d});
    }
    if(e.contractEnd){
      const d = daysUntil(e.contractEnd);
      if(d!==null && d<=60) alerts.push({level:d<=14?'red':'yellow', emp:e, text:`契約終了日 ${e.contractEnd}（あと${d}日）— 更新手続き要確認`, sort:d});
    }
    if(e.probationEnd){
      const d = daysUntil(e.probationEnd);
      if(d!==null && d>=0 && d<=30) alerts.push({level:'blue', emp:e, text:`試用期間終了 ${e.probationEnd}（あと${d}日）`, sort:d});
    }
    const pr = docProgress(e);
    if(pr.total>0 && pr.pct<100 && e.status==='内定'){
      const pend = pr.total - pr.done;
      alerts.push({level:'blue', emp:e, text:`入社書類 未完了 ${pend}件（${pr.pct}%完了）`, sort:500+pend});
    }
  });
  alerts.sort((a,b)=>a.sort-b.sort);
  return alerts;
}

/* ================= AUTH ================= */
async function boot(){
  const {data:{session:s}} = await sb.auth.getSession();
  session = s;
  if(!session){ showLogin(); return; }
  await start();
}
async function start(){
  document.getElementById('main').innerHTML = '<div class="login-wrap"><div class="muted">データ読み込み中…</div></div>';
  try{ await loadAll(); }
  catch(e){ showLogin('データ取得に失敗しました：'+e.message); return; }
  if(!data.allowedUsers.length){
    document.getElementById('nav').innerHTML='';
    document.getElementById('main').innerHTML = `
    <div class="login-wrap"><div class="login-card">
      <h2>アクセス権がありません</h2>
      <p class="muted">このアカウント（${esc(session.user.email)}）は許可リストに登録されていません。管理者に「データ管理＞利用ユーザー」への追加を依頼してください。</p>
      <button class="btn" onclick="logout()">ログアウト</button>
    </div></div>`;
    return;
  }
  render();
}
function showLogin(msg, ok){
  document.getElementById('nav').innerHTML='';
  document.getElementById('main').innerHTML = `
  <div class="login-wrap"><div class="login-card">
    <h2>ログイン</h2>
    <p class="muted">KMT 人事管理システム — 許可されたメールアドレスのみ利用できます。</p>
    <input type="email" id="lg_email" placeholder="メールアドレス" autocomplete="username">
    <input type="password" id="lg_pass" placeholder="パスワード" autocomplete="current-password">
    <button class="btn" onclick="login()">ログイン</button>
    <button class="btn secondary" style="margin-top:8px" onclick="signup()">新規登録（初回のみ）</button>
    <div class="login-msg ${ok?'ok':''}" id="lg_msg">${esc(msg||'')}</div>
  </div></div>`;
  const p = document.getElementById('lg_pass');
  p.addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
}
async function login(){
  const email = document.getElementById('lg_email').value.trim();
  const pass = document.getElementById('lg_pass').value;
  if(!email||!pass){ document.getElementById('lg_msg').textContent='メールとパスワードを入力してください'; return; }
  const {data:d, error} = await sb.auth.signInWithPassword({email, password:pass});
  if(error){ document.getElementById('lg_msg').textContent = 'ログイン失敗：'+error.message; return; }
  session = d.session;
  await start();
}
async function signup(){
  const email = document.getElementById('lg_email').value.trim();
  const pass = document.getElementById('lg_pass').value;
  if(!email||!pass){ document.getElementById('lg_msg').textContent='メールとパスワード（6文字以上）を入力してください'; return; }
  const {error} = await sb.auth.signUp({email, password:pass});
  if(error){ document.getElementById('lg_msg').textContent = '登録失敗：'+error.message; return; }
  showLogin('確認メールを送信しました。メール内のリンクをクリックしてから、ここでログインしてください。', true);
}
async function logout(){
  await sb.auth.signOut();
  session = null;
  showLogin();
}
async function reloadData(){
  toast('再読み込み中…');
  try{ await loadAll(); render(); toast('最新データを読み込みました'); }
  catch(e){}
}

/* ================= RENDER ================= */
const NAV = [
  ['dashboard','ダッシュボード'],
  ['employees','従業員・人事情報'],
  ['docs','労務・書類管理'],
  ['evals','評価管理'],
  ['kpi','KPI管理'],
  ['assets','資産管理'],
  ['data','データ管理'],
];
function renderNav(){
  document.getElementById('nav').innerHTML = NAV.map(([k,l])=>
    `<button class="${view===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('')
    + `<button title="最新データを取得" onclick="reloadData()">↻</button>`
    + `<span class="userchip">${esc(session?session.user.email:'')} <a href="javascript:logout()" style="color:#9fc3f0">ログアウト</a></span>`;
}
function go(v){ view=v; if(v!=='employees') currentEmpId=null; render(); window.scrollTo(0,0); }
function render(){
  renderNav();
  const m = document.getElementById('main');
  if(view==='dashboard') m.innerHTML = viewDashboard();
  else if(view==='employees') m.innerHTML = currentEmpId? viewEmpDetail(currentEmpId) : viewEmployees();
  else if(view==='docs') m.innerHTML = viewDocs();
  else if(view==='evals') m.innerHTML = viewEvals();
  else if(view==='kpi') m.innerHTML = viewKpi();
  else if(view==='assets') m.innerHTML = viewAssets();
  else if(view==='data') m.innerHTML = viewData();
}

    <div class="stat"><div class="num">${active.length}</div><div class="lbl">在籍者数</div></div>

    <div class="stat"><div class="num">${emps.filter(e=>e.status==='内定').length}</div><div class="lbl">内定者</div></div>
    <div class="stat"><div class="num">${lent}</div><div class="lbl">貸与中資産</div></div>
    <div class="stat"><div class="num">${alerts.filter(a=>a.level==='red').length}</div><div class="lbl">要対応アラート</div></div>
  </div>
  <div class="panel" style="margin-top:16px">
    <h2>⚠️ アラート <span class="en">Residence / contract / document deadlines</span></h2>
    ${alerts.length? alerts.map(a=>`
      <div class="alert-item ${a.level}">
        <b><a href="javascript:openEmp('${a.emp.id}')">${esc(a.emp.nameKanji||a.emp.nameRoma)}</a></b>
        <span>${esc(a.text)}</span>
      </div>`).join('') : '<div class="muted">現在アラートはありません。</div>'}

      <h2>国籍別在籍者</h2>

    </div>
    <div class="panel">
      <h2>部署別在籍者</h2>
      <table>${(function(){const m={};active.forEach(e=>{const d=e.department||'未設定';m[d]=(m[d]||0)+1;});return Object.entries(m).map(([k,v])=>`<tr><td>${esc(k)}</td><td style="text-align:right;font-weight:700">${v}名</td></tr>`).join('')||'<tr><td class="muted">データなし</td></tr>';})()}</table>
    </div>
    <div class="panel">
      <h2>書類完了状況（内定・在籍者）</h2>
      <table>${emps.filter(e=>e.status==='内定'||e.status==='在籍').map(e=>{const p=docProgress(e);return `<tr class="clickable" onclick="openEmp('${e.id}')"><td>${esc(e.nameKanji||e.nameRoma)}</td><td style="width:110px"><div class="progress"><div style="width:${p.pct}%"></div></div></td><td style="text-align:right">${p.done}/${p.total}</td></tr>`;}).join('')||'<tr><td class="muted">データなし</td></tr>'}</table>
    </div>

/* ---------------- employees ---------------- */
function viewEmployees(){
  const f = empFilter;
  let list = data.employees.filter(e=>{
    if(f.status && e.status!==f.status) return false;
    if(f.type && e.employmentType!==f.type) return false;
    if(f.dept && e.department!==f.dept) return false;
    if(f.q){
      const q=f.q.toLowerCase();
      const hay=[e.empNo,e.nameKanji,e.nameKana,e.nameRoma,e.nationality,e.email].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  list.sort((a,b)=>(a.empNo||'').localeCompare(b.empNo||''));
  return `
  <div class="panel">
    <h2>従業員一覧 <span class="en">Employee master（${list.length}名表示）</span></h2>
    <div class="toolbar">
      <input placeholder="検索：氏名・社員番号・国籍…" value="${esc(f.q)}" oninput="empFilter.q=this.value;render()" style="width:220px">
      <select onchange="empFilter.status=this.value;render()">
        <option value="">全ステータス</option>
        ${EMP_STATUSES.map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <select onchange="empFilter.type=this.value;render()">
        <option value="">全雇用区分</option>
        ${EMP_TYPES.map(s=>`<option ${f.type===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <select onchange="empFilter.dept=this.value;render()">
        <option value="">全部署</option>
        ${data.departments.map(s=>`<option ${f.dept===s?'selected':''}>${esc(s)}</option>`).join('')}
      </select>
      <div class="spacer"></div>
      <button class="btn secondary" onclick="exportEmpCsv()">CSV出力</button>
      <button class="btn" onclick="openEmpForm()">＋ 従業員登録</button>
    </div>
    <div class="tablewrap"><table>
      <tr><th>社員番号</th><th>氏名</th><th>ローマ字</th><th>国籍</th><th>雇用区分</th><th>部署</th><th>入社日</th><th>在留資格</th><th>在留期限</th><th>書類</th><th>状態</th></tr>
      ${list.map(e=>{
        const p=docProgress(e);
        const zd = e.isForeign&&e.zairyuExpiry? daysUntil(e.zairyuExpiry):null;
        return `<tr class="clickable" onclick="openEmp('${e.id}')">
          <td>${esc(e.empNo)}</td>
          <td><b>${esc(e.nameKanji||e.nameRoma)}</b><br><span class="muted">${esc(e.nameKana||'')}</span></td>
          <td>${esc(e.nameRoma||'')}</td>
          <td>${esc(e.nationality||'')}</td>
          <td><span class="badge ${e.employmentType==='正社員'?'b-blue':e.employmentType==='海外リモート'?'b-yellow':'b-gray'}">${esc(e.employmentType)}</span></td>
          <td>${esc(e.department||'')}</td>
          <td>${fmtDate(e.hireDate)}</td>
          <td>${e.isForeign?esc(e.zairyuStatus||'未設定'):'—'}</td>
          <td>${e.isForeign? (e.zairyuExpiry? `${e.zairyuExpiry} ${zd!==null&&zd<=90?`<span class="badge ${zd<=30?'b-red':'b-yellow'}">あと${zd}日</span>`:''}`:'<span class="badge b-red">未登録</span>') : '—'}</td>

async function setDoc(empId, docId, field, val){
  const e = empById(empId); if(!e) return;
  if(!e.docs[docId]) e.docs[docId] = {status:'未依頼', date:'', note:''};
  const st = e.docs[docId];
  st[field]=val;
  if(field==='status' && (val==='受領'||val==='確認済') && !st.date) st.date = today();
  await q(sb.from('employee_docs').upsert({employee_id:empId, doc_id:docId, status:st.status, date:dOrNull(st.date), note:st.note||''}));
  render();
}

async function deleteEmp(id){
  if(!confirm('この従業員データを削除しますか？（書類記録・評価も削除、KPI・資産の紐付けは解除されます）')) return;
  await q(sb.from('employees').delete().eq('id', id));
  data.employees = data.employees.filter(e=>e.id!==id);
  data.evaluations = data.evaluations.filter(v=>v.empId!==id);
  data.kpis.forEach(k=>{ if(k.empId===id) k.empId=''; });
  data.assets.forEach(a=>{ if(a.assignedTo===id){ a.assignedTo=''; if(a.status==='貸与中')a.status='在庫'; }});
  toast('削除しました');
  closeModal(); currentEmpId=null; render();
}

async function bulkCreateEvals(){

  const created = [];
  data.employees.filter(e=>e.status==='在籍').forEach(e=>{

      created.push({id:uid(), empId:e.id, period, evaluator:'', status:'目標設定', goals:[], selfScore:'', mgrScore:'', finalGrade:'', comment:''});

/* ---------------- KPI ---------------- */
function kpiRate(k){
  const t = parseFloat(k.target);
  const a = (k.records||[]).reduce((s,r)=>s+(parseFloat(r.actual)||0),0);
  if(!t) return null;
  return Math.round(a/t*100);
}
function kpiActual(k){ return (k.records||[]).reduce((s,r)=>s+(parseFloat(r.actual)||0),0); }

async function saveKpi(isNew){
  const k = window._kpiDraft;
  k.period = document.getElementById('kp_period').value.trim();
  k.scope = document.getElementById('kp_scope').value;
  k.empId = k.scope==='個人'? document.getElementById('kp_emp').value : '';
  k.dept = k.scope==='部署'? document.getElementById('kp_dept').value : '';
  k.name = document.getElementById('kp_name').value.trim();
  k.target = document.getElementById('kp_target').value;
  k.unit = document.getElementById('kp_unit').value.trim();
  k.notes = document.getElementById('kp_notes').value;

  else{ const i = data.kpis.findIndex(x=>x.id===k.id); if(i>=0) data.kpis[i]=k; }
  toast('保存しました');
  closeModal(); render();
}
async function deleteKpi(id){

}

/* ---------------- export / import ---------------- */
function download(filename, content, mime){
  const blob = new Blob([content], {type:mime||'application/octet-stream'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function exportJson(){
  const out = {
    version:2, exportedAt:new Date().toISOString(),
    departments:data.departments,
    docTemplates:data.docTemplates,
    employees:data.employees,
    evaluations:data.evaluations,
    kpis:data.kpis,
    assets:data.assets
  };
  download(`KMT-HR-backup-${today()}.json`, JSON.stringify(out, null, 1), 'application/json');
}
async function importJson(){
  const f = document.getElementById('importFile').files[0];
  if(!f){ alert('JSONファイルを選択してください'); return; }
  const text = await f.text();
  let d;
  try{ d = JSON.parse(text); }catch(e){ alert('JSONの解析に失敗しました：'+e.message); return; }
  if(!d.employees || !Array.isArray(d.employees)){ alert('形式が違います（employeesがありません）'); return; }
  if(!confirm(`従業員${d.employees.length}名のデータを取り込みます。現在のSupabase上のデータは全て置き換えられます。よろしいですか？`)) return;
  if(!confirm('最終確認：現在のデータのバックアップは保存済みですか？実行します。')) return;
  toast('取込中…');
  try{
    // wipe
    await q(sb.from('assets').delete().neq('id','00000000-0000-0000-0000-000000000000'));
    await q(sb.from('kpis').delete().neq('id','00000000-0000-0000-0000-000000000000'));
    await q(sb.from('evaluations').delete().neq('id','00000000-0000-0000-0000-000000000000'));
    await q(sb.from('employees').delete().neq('id','00000000-0000-0000-0000-000000000000'));
    await q(sb.from('doc_templates').delete().neq('id',''));
    await q(sb.from('departments').delete().neq('name',''));
    // remap old (non-uuid) ids to uuids
    const isUuid = s=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s||'');
    const idMap = {};
    const mapId = old=>{ if(isUuid(old)) return old; if(!idMap[old]) idMap[old]=uid(); return idMap[old]; };
    // departments
    const deps = (d.departments||[]).map((name,i)=>({name, sort_order:i+1}));
    if(deps.length) await q(sb.from('departments').insert(deps));
    // doc templates
    const tpls = (d.docTemplates||DEFAULT_DOC_TEMPLATES).map((t,i)=>({id:t.id, stage:t.stage, name:t.name, tags:t.tags, note:t.note||'', sort_order:t.sort_order!=null?t.sort_order:i+1}));
    if(tpls.length) await q(sb.from('doc_templates').insert(tpls));
    // employees
    const emps = d.employees.map(e=>{ const ne = Object.assign({}, e, {id:mapId(e.id)}); return ne; });
    if(emps.length) await q(sb.from('employees').insert(emps.map(empToDb)));
    // employee docs
    const docRows = [];
    emps.forEach(e=>{
      Object.entries(e.docs||{}).forEach(([docId, st])=>{
        docRows.push({employee_id:e.id, doc_id:docId, status:st.status||'未依頼', date:dOrNull(st.date), note:st.note||''});
      });
    });
    if(docRows.length) await q(sb.from('employee_docs').insert(docRows));
    // evaluations
    const evals = (d.evaluations||[]).map(v=>Object.assign({}, v, {id:mapId(v.id), empId:mapId(v.empId)}));
    if(evals.length) await q(sb.from('evaluations').insert(evals.map(evalToDb)));
    // kpis
    const kpis = (d.kpis||[]).map(k=>Object.assign({}, k, {id:mapId(k.id), empId:k.empId?mapId(k.empId):''}));
    if(kpis.length) await q(sb.from('kpis').insert(kpis.map(kpiToDb)));
    // assets
    const assets = (d.assets||[]).map(a=>Object.assign({}, a, {id:mapId(a.id), assignedTo:a.assignedTo?mapId(a.assignedTo):''}));
    if(assets.length) await q(sb.from('assets').insert(assets.map(assetToDb)));
    await loadAll(); render(); toast('取込が完了しました');
  }catch(e){
    toast('取込エラー：'+e.message, true);
  }
}
function csvCell(v){ v = String(v==null?'':v); return '"'+v.replace(/"/g,'""')+'"'; }

  const head = ['社員番号','ステータス','氏名','フリガナ','ローマ字','生年月日','性別','国籍','外国籍','雇用区分','部署','役職','入社日','試用期間終了','契約終了日','退職日','メール','電話','住所','緊急連絡先','緊急電話','社会保険','雇用保険番号','基礎年金番号','マイナンバー提出','在留資格','在留カード番号','在留期限','パスポート番号','パスポート期限','書類完了率','メモ'];

}
function exportAssetCsv(){
  const head = ['管理番号','種別','名称','シリアル','購入日','価格','状態','貸与先','貸与日','返却日','メモ'];
  const rows = data.assets.map(a=>[a.assetNo,a.category,a.name,a.serial,a.purchaseDate,a.price,a.status,a.assignedTo?empName(a.assignedTo):'',a.lendDate,a.returnDate,a.notes].map(csvCell).join(','));

}
